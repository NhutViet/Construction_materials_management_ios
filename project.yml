name: ConstructionMaterials
options:
  bundleIdPrefix: com.nhutviet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: "2.55.0"

targets:
  ConstructionMaterials:
    type: application
    platform: iOS
    sources:
      - path: ConstructionMaterials
    info:
      path: ConstructionMaterials/Info.plist
      properties:
        CFBundleDisplayName: Vật liệu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nhutviet.constructionmaterials
        PRODUCT_NAME: ConstructionMaterials
    dependencies:
      - package: Supabase
        product: Supabase
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig

schemes:
  ConstructionMaterials:
    build:
      targets:
        ConstructionMaterials: all
    run:
      config: Debug
    archive:
      config: Release
